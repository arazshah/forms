<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیر | {{ app_name }}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #172033;
            --muted: #667085;
            --border: #e4e7ec;
            --bg: #f7f9fc;
            --danger-bg: #fef2f2;
            --danger-text: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            font-family: Vazirmatn, Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #dbeafe 0, transparent 32%),
                radial-gradient(circle at bottom left, #e0f2fe 0, transparent 28%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 55px rgba(15, 23, 42, 0.10);
        }

        .brand {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 15px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            background: var(--primary);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.8;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #fecdca;
            border-radius: 10px;
            color: var(--danger-text);
            background: var(--danger-bg);
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            background: var(--primary);
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .footer {
            margin: 22px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">A</div>

        <h1>ورود به پنل مدیریت</h1>
        <p class="subtitle">
            برای مدیریت فرم‌ها و مشاهده پاسخ کاربران وارد شوید.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="field">
                <label for="username">نام کاربری</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">ورود به پنل</button>
        </form>

        <p class="footer">{{ app_name }}</p>
    </main>
</body>
</html>
